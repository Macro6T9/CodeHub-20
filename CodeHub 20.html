<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeHub 20</title>
<script>try{if(localStorage.getItem("editor-theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-page:#0f111a;--bg-panel:#1a1c23;--bg-header:#14161d;--border:#2a2d3d;--text:#a6accd;--text-hover:#d7dae7;--text-strong:#fff;--muted:#767c9d;--line-num:#464b5d;--accent:#82aaff;--accent-rgb:130,170,255;--green:#c3e88d;--green-rgb:195,232,141;--red:#ff5370;--red-rgb:255,83,112;--yellow:#ffcb6b;--yellow-rgb:255,203,107;--on-accent:#14161d;--hover:rgba(255,255,255,.06);--hover-soft:rgba(255,255,255,.03);--shadow:rgba(0,0,0,.5);--code:#c3e88d;--preview-bg:#1a1c23;color-scheme:dark}
:root[data-theme="light"]{--bg-page:#eef0f6;--bg-panel:#ffffff;--bg-header:#f3f4fa;--border:#d3d8e6;--text:#3d4257;--text-hover:#1b1f30;--text-strong:#12162a;--muted:#6a7090;--line-num:#a3a9c1;--accent:#2d5bd1;--accent-rgb:45,91,209;--green:#2b7a35;--green-rgb:43,122,53;--red:#d6304d;--red-rgb:214,48,77;--yellow:#b36b00;--yellow-rgb:179,107,0;--on-accent:#fff;--hover:rgba(20,30,70,.06);--hover-soft:rgba(20,30,70,.04);--shadow:rgba(30,40,90,.15);--code:#1f2a44;--preview-bg:#fff;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg-page);color:var(--text);font-family:'Poppins',sans-serif;padding:25px 15px}
.code-editor-container{max-width:1050px;margin:0 auto;background:var(--bg-panel);border-radius:12px;box-shadow:0 10px 30px var(--shadow);overflow:hidden;border:1px solid var(--border)}
.ico{display:inline-block;vertical-align:middle;flex-shrink:0}
.logo{width:20px;height:20px;object-fit:contain;flex-shrink:0;display:inline-block;vertical-align:middle}
.lang-item .check{display:inline-flex}
.editor-header{display:flex;justify-content:space-between;align-items:center;background:var(--bg-header);padding:0 15px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
.brand-title{font-size:14px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:8px;padding:10px 0}
.tabs-bar{display:flex;align-items:flex-end;min-height:47px;padding:0 15px;background:var(--bg-header);border-bottom:1px solid var(--border)}
.tabs{display:flex;flex:1;gap:4px;overflow-x:auto;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{background:transparent;color:var(--muted);border:none;outline:none;padding:12px 10px 12px 18px;cursor:pointer;font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;border-bottom:3px solid transparent;transition:all .3s ease;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab-btn:hover{color:var(--text-hover);background:var(--hover-soft)}
.tab-btn.active{color:var(--text-strong);background:var(--bg-panel);border-bottom:3px solid var(--accent);border-top-left-radius:6px;border-top-right-radius:6px}
.tab-btn{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tab-btn.dragging{position:relative;z-index:5;transition:none;cursor:grabbing;background:var(--border);color:var(--text-strong);box-shadow:0 6px 18px var(--shadow);border-radius:6px;opacity:.95}
.tab-close{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);transition:all .2s ease}
.tab-close:hover{background:var(--red);color:#fff}
.add-wrap{position:relative;flex-shrink:0;align-self:center;margin-left:8px}
.add-lang-btn{width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;background:rgba(var(--accent-rgb),.1);color:var(--accent);border:1px solid rgba(var(--accent-rgb),.3);transition:all .2s ease}
.add-lang-btn:hover{background:var(--accent);color:var(--on-accent)}
.close-all-btn{flex-shrink:0;align-self:center;margin-left:8px;width:32px;height:32px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:rgba(var(--red-rgb),.1);color:var(--red);border:1px solid rgba(var(--red-rgb),.3);transition:all .2s ease}
.close-all-btn:hover{background:var(--red);color:#fff}
.close-all-btn,.add-lang-btn{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#tip{position:fixed;z-index:50;background:#2a2d3d;color:#fff;font-size:12px;font-weight:500;padding:6px 10px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .15s ease;white-space:nowrap;transform:translateX(-50%)}
#tip.show{opacity:1}
.picker{display:none;position:absolute;inset:0;z-index:2;background:var(--bg-panel);flex-direction:column;overflow-y:auto;padding:14px 16px}
.picker::-webkit-scrollbar{width:8px}
.picker::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.picker-title{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:10px}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.picker-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text);transition:all .2s ease;user-select:none;-webkit-user-select:none}
.picker-item:hover{background:var(--hover);color:var(--text-strong)}
.picker-item.selected{border-color:var(--accent);background:rgba(var(--accent-rgb),.1);color:var(--text-strong)}
.picker-check{margin-left:auto;display:inline-flex;min-width:12px;color:var(--accent)}
.picker-foot{position:sticky;bottom:-14px;margin-top:auto;padding:12px 0 14px;background:var(--bg-panel)}
.lang-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;width:230px;max-height:260px;overflow-y:auto;background:var(--bg-header);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 25px var(--shadow);z-index:10;padding:6px}
.lang-menu.show{display:block}
.lang-menu::-webkit-scrollbar{width:6px}
.lang-menu::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.lang-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text);transition:background .2s ease}
.lang-item:hover{background:var(--hover);color:var(--text-strong)}
.lang-item.added{color:var(--green)}
.lang-item .check{margin-left:auto;font-size:11px}
.mode-mini{margin-left:auto;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.5px}
.lang-item .check+.mode-mini{margin-left:6px}
.mode-browser{background:rgba(var(--green-rgb),.1);color:var(--green)}
.mode-server{background:rgba(var(--yellow-rgb),.1);color:var(--yellow)}
.button-bar{display:flex;gap:10px;margin:8px 0}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;transition:all .2s ease;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:wait}
.run-btn{background:rgba(var(--accent-rgb),.1);color:var(--accent);border:1px solid rgba(var(--accent-rgb),.3)}
.run-btn:hover:not(:disabled){background:var(--accent);color:var(--on-accent)}
.reset-btn{background:rgba(var(--red-rgb),.1);color:var(--red);border:1px solid rgba(var(--red-rgb),.3)}
.reset-btn:hover{background:var(--red);color:#fff}
.download-btn{background:rgba(var(--green-rgb),.1);color:var(--green);border:1px solid rgba(var(--green-rgb),.3)}
.download-btn:hover{background:var(--green);color:var(--on-accent)}
.editor-wrapper{display:flex;background:var(--bg-panel);height:300px;position:relative;padding:10px}
.editor-frame{display:flex;flex:1;min-width:0;height:100%;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg-panel);transition:border-color .2s ease}
.editor-frame:focus-within{border-color:var(--accent)}
.line-numbers{min-width:45px;width:max-content;background:var(--bg-header);color:var(--line-num);font-family:'Fira Code',monospace;font-size:14px;line-height:1.6;padding:15px 8px;text-align:right;user-select:none;border-right:1px solid var(--border);overflow:hidden;flex-shrink:0}
.line-numbers div{white-space:nowrap;overflow:hidden}
textarea{flex:1;min-width:0;height:100%;background:var(--bg-panel);color:var(--code);border:none;padding:15px;font-family:'Fira Code',monospace;font-size:14px;line-height:1.6;resize:none;outline:none;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;overflow-x:hidden;overflow-y:scroll}
textarea:disabled{cursor:not-allowed}
textarea::-webkit-scrollbar,.line-numbers::-webkit-scrollbar{width:8px}
textarea::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.preview-section{border-top:2px solid var(--border);background:var(--preview-bg)}
.preview-header{background:var(--bg-header);color:var(--accent);padding:10px 20px;font-size:12px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.preview-header .mode-mini{font-size:10px}
iframe{width:100%;height:300px;border:none;background:var(--preview-bg);color-scheme:light;display:block}
#console{display:none;height:300px;overflow:auto;background:var(--bg-page);color:var(--green);padding:15px;font-family:'Fira Code',monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
#console.err{color:var(--red)}
#console.info{color:var(--muted)}

.theme-btn{background:rgba(var(--yellow-rgb),.1);color:var(--yellow);border:1px solid rgba(var(--yellow-rgb),.3)}
.theme-btn:hover{background:var(--yellow);color:var(--on-accent)}
/* Blinking green "live" dot next to the output title */
.live-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;animation:live-blink 1.3s ease-in-out infinite}
@keyframes live-blink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.55)}50%{opacity:.25;box-shadow:0 0 0 5px rgba(34,197,94,0)}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
/* Desktop: code on the left, output on the right */
@media (min-width:900px){
  .code-editor-container{max-width:1500px}
  .workspace{display:flex;height:clamp(440px,calc(100vh - 220px),780px)}
  .workspace .editor-wrapper{flex:1 1 50%;min-width:0;height:100%}
  .workspace .preview-section{flex:1 1 50%;min-width:0;height:100%;display:flex;flex-direction:column;border-top:none;border-left:2px solid var(--border)}
  .workspace iframe,.workspace #console{flex:1;height:auto;min-height:0}
}
.tabs-clear{flex-shrink:0;align-self:center;margin-left:8px;width:32px;height:32px;padding:0;justify-content:center}
.confirm-ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}
.confirm-ov.show{display:flex}
.confirm-box{width:100%;max-width:360px;background:var(--bg-panel);color:var(--text);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px var(--shadow);padding:20px}
.confirm-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--red);margin-bottom:8px}
.confirm-msg{font-size:14px;line-height:1.5;margin-bottom:18px}
.confirm-actions{display:flex;justify-content:flex-end;gap:10px}
.confirm-no{background:var(--hover);color:var(--text-strong);border:1px solid var(--border)}
.confirm-yes{background:var(--red);color:#fff;border:1px solid var(--red)}
.site-footer{max-width:1050px;margin:18px auto 0;text-align:center;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.2px}
.site-footer strong{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="code-editor-container">
  <div class="editor-header">
    <div class="brand-title"><span data-ico="code"></span> CodeHub 20</div>
    <div class="button-bar">
      <button class="btn theme-btn" id="theme-btn" type="button"></button>
      <button class="btn download-btn" onclick="downloadCode()"><span data-ico="download"></span> Download</button>
    </div>
  </div>
  <div class="tabs-bar">
    <div class="tabs" id="tabs"></div>
    <button class="close-all-btn" id="close-all-btn" type="button" data-tip="Close All Tabs" aria-label="Close All Tabs"><span data-ico="closeall"></span></button>
    <button class="btn reset-btn tabs-clear" onclick="confirmClear()" type="button" data-tip="Clear" aria-label="Clear"><span data-ico="reset"></span></button>
    <div class="add-wrap">
      <button class="add-lang-btn" id="add-lang-btn" type="button" data-tip="Add Language" aria-label="Add Language"><span data-ico="plus"></span></button>
      <div class="lang-menu" id="lang-menu"></div>
    </div>
  </div>
  <div class="workspace">
  <div class="editor-wrapper">
    <div class="editor-frame">
      <div class="line-numbers" id="line-numbers"></div>
      <textarea id="code-area" spellcheck="false"></textarea>
    </div>
    <div class="picker" id="picker"></div>
  </div>
  <div class="preview-section">
    <div class="preview-header">
      <span data-ico="play"></span> <span id="preview-title">LIVE OUTPUT</span><span class="live-dot" aria-hidden="true"></span>
      <span class="mode-mini" id="mode-tag" style="display:none"></span>
    </div>
    <iframe id="output-frame"></iframe>
    <div id="console"></div>
  </div>
  </div>
</div>
<div class="confirm-ov" id="confirm-ov" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="confirm-box">
    <div class="confirm-title" id="confirm-title">&#9888; Warning</div>
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-actions">
      <button class="btn confirm-no" id="confirm-no" type="button">No</button>
      <button class="btn confirm-yes" id="confirm-yes" type="button">Yes</button>
    </div>
  </div>
</div>
<footer class="site-footer">Copyright &copy; 2026 <strong>Md. Tanjil Almas Shrabon</strong></footer>

<script>
// ================== Server settings ==================
const JUDGE_HOSTS = ["https://ce.judge0.com", "https://extra-ce.judge0.com"];
const JUDGE_MATCH = {
  c:/^C \(GCC/, cpp:/^C\+\+ \(GCC/, csharp:/^C# \(Mono/, java:/^Java \(/, php:/^PHP/, go:/^Go/,
  rust:/^Rust/, kotlin:/^Kotlin/, swift:/^Swift/, ruby:/^Ruby/, dart:/^Dart/, r:/^R \(/,
  scala:/^Scala/, lua:/^Lua/
};

const ICON_PATHS = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  xmark:'<path d="M6 6l12 12M18 6L6 18"/>',
  closeall:'<path d="M4 7l9 9M13 7l-9 9M12 4l8 8M20 4l-8 8" transform="translate(0 2)"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  code:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/>',
  reset:'<path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/>',
  download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  play:'<path d="M7 5l12 7-12 7z" fill="currentColor" stroke="none"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'
};
function svg(name,size=14){
  return `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]}</svg>`;
}
const T='text-anchor="middle" font-family="Arial,sans-serif" font-weight="700"';
const LOGOS = {
  python:'<rect x="4" y="3" width="16" height="16" rx="5" fill="#3776ab"/><rect x="12" y="13" width="16" height="16" rx="5" fill="#ffd43b"/><circle cx="10" cy="8" r="1.6" fill="#fff"/><circle cx="22" cy="24" r="1.6" fill="#3776ab"/>',
  html:'<path d="M5 3l2 22 9 4 9-4 2-22z" fill="#e34f26"/><path d="M16 5.5v21.7l7.2-3.2 1.7-18.5z" fill="#ef652a"/><text x="16" y="21" '+T+' font-size="13" fill="#fff">5</text>',
  css:'<path d="M5 3l2 22 9 4 9-4 2-22z" fill="#1572b6"/><path d="M16 5.5v21.7l7.2-3.2 1.7-18.5z" fill="#33a9dc"/><text x="16" y="21" '+T+' font-size="13" fill="#fff">3</text>',
  javascript:'<rect width="32" height="32" rx="3" fill="#f7df1e"/><text x="29" y="28" text-anchor="end" font-family="Arial,sans-serif" font-weight="700" font-size="15" fill="#14161d">JS</text>',
  typescript:'<rect width="32" height="32" rx="3" fill="#3178c6"/><text x="29" y="28" text-anchor="end" font-family="Arial,sans-serif" font-weight="700" font-size="15" fill="#fff">TS</text>',
  sql:'<ellipse cx="16" cy="8" rx="10" ry="4" fill="#48cae4"/><path d="M6 8v8c0 2.2 4.5 4 10 4s10-1.8 10-4V8c0 2.2-4.5 4-10 4S6 10.2 6 8z" fill="#0096c7"/><path d="M6 16v8c0 2.2 4.5 4 10 4s10-1.8 10-4v-8c0 2.2-4.5 4-10 4s-10-1.8-10-4z" fill="#0077b6"/>',
  java:'<path d="M6 16h15v6a5 5 0 0 1-5 5h-5a5 5 0 0 1-5-5z" fill="#5382a1"/><path d="M21 17h2a3 3 0 0 1 0 6h-2" fill="none" stroke="#5382a1" stroke-width="2"/><path d="M11 4c3 3-3 4 0 8M16 5c3 3-3 4 0 7" fill="none" stroke="#e76f00" stroke-width="2" stroke-linecap="round"/><path d="M5 29h17" stroke="#e76f00" stroke-width="2" stroke-linecap="round"/>',
  c:'<path d="M16 2l12.5 7v14L16 30 3.5 23V9z" fill="#659ad2"/><text x="16" y="21" '+T+' font-size="16" fill="#fff">C</text>',
  cpp:'<path d="M16 2l12.5 7v14L16 30 3.5 23V9z" fill="#00599c"/><text x="16" y="20" '+T+' font-size="11" fill="#fff">C++</text>',
  csharp:'<path d="M16 2l12.5 7v14L16 30 3.5 23V9z" fill="#9b4f96"/><text x="16" y="20" '+T+' font-size="13" fill="#fff">C#</text>',
  php:'<ellipse cx="16" cy="16" rx="15" ry="9.5" fill="#777bb3"/><text x="16" y="20" '+T+' font-size="11" font-style="italic" fill="#fff">php</text>',
  go:'<rect x="1" y="7" width="30" height="18" rx="9" fill="#00add8"/><text x="16" y="21" '+T+' font-size="12" fill="#fff">GO</text>',
  rust:'<circle cx="16" cy="16" r="12" fill="none" stroke="#dea584" stroke-width="4" stroke-dasharray="3.1 3.1"/><circle cx="16" cy="16" r="9" fill="#dea584"/><text x="16" y="21" '+T+' font-size="13" fill="#14161d">R</text>',
  kotlin:'<path d="M3 3h26L16 16l13 13H3z" fill="#a97bff"/><path d="M3 3h13L3 16z" fill="#e44857"/>',
  swift:'<rect x="2" y="2" width="28" height="28" rx="7" fill="#fa7343"/><path d="M22 10c-3 3-8 6-13 5 4 5 9 4 11 2-1 3-4 5-9 4 6 4 13 1 11-11z" fill="#fff"/>',
  ruby:'<path d="M9 4h14l6 7-13 17L3 11z" fill="#cc342d"/><path d="M3 11h26M12 11l4 17 4-17M9 4l3 7M23 4l-3 7" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.2"/>',
  dart:'<path d="M4 12L12 4h13l3 3v13L16 28 4 16z" fill="#0175c2"/><path d="M12 4l16 16-8 8L4 12z" fill="#40c4ff"/>',
  lua:'<circle cx="15" cy="17" r="12" fill="#4c5fd5"/><circle cx="15" cy="17" r="6" fill="#fff"/><circle cx="25" cy="7" r="4" fill="#4c5fd5"/>',
  r:'<ellipse cx="16" cy="16" rx="14" ry="11" fill="#b8bfc9"/><text x="16" y="22" '+T+' font-size="17" fill="#276dc3">R</text>',
  scala:'<path d="M8 3c10 1 16 2 16 5v4c0-3-6-4-16-5z" fill="#dc322f"/><path d="M8 12c10 1 16 2 16 5v4c0-3-6-4-16-5z" fill="#c02523"/><path d="M8 21c10 1 16 2 16 5v3c0-3-6-4-16-5z" fill="#dc322f"/>'
};
function badge(lang){return `<svg class="logo" viewBox="0 0 32 32" aria-label="${lang.name}">${LOGOS[lang.id]}</svg>`}
document.querySelectorAll("[data-ico]").forEach(el=>{el.outerHTML=svg(el.dataset.ico)});

// ================== Dark / Light theme ==================
let theme=document.documentElement.dataset.theme==="light"?"light":"dark";
function applyTheme(t){
  theme=t;document.documentElement.dataset.theme=t;
  const b=document.getElementById("theme-btn");
  b.innerHTML=svg(t==="light"?"moon":"sun")+" "+(t==="light"?"Dark":"Light");
  b.setAttribute("aria-label",t==="light"?"Switch to dark mode":"Switch to light mode");
}
document.getElementById("theme-btn").addEventListener("click",()=>{
  applyTheme(theme==="dark"?"light":"dark");
  try{localStorage.setItem("editor-theme",theme)}catch(e){}
  syncPreviewTheme();
});
applyTheme(theme);

// ================== Press and hold a tab to drag it left/right ==================
// Touch: hold a tab for ~0.35s to start dragging. Mouse: click and drag.
let dragMoved=false,dragging=null;
// Mouse wheel scrolls the tab bar horizontally
tabsEl.addEventListener("wheel",e=>{
  if(tabsEl.scrollWidth<=tabsEl.clientWidth)return;
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  e.preventDefault();
  tabsEl.scrollBy({left:d,behavior:"auto"});
},{passive:false});
tabsEl.addEventListener("touchmove",e=>{if(dragging)e.preventDefault()},{passive:false});

function attachDrag(btn){
  btn.addEventListener("pointerdown",e=>{
    if(e.button>0||e.target.closest(".tab-close"))return;
    const isMouse=e.pointerType==="mouse";
    const sx=e.clientX,sy=e.clientY;
    let timer=null,active=false,grab=0;

    const start=()=>{
      active=true;dragging=btn;dragMoved=true;
      grab=sx-btn.getBoundingClientRect().left;
      btn.classList.add("dragging");
      try{btn.setPointerCapture(e.pointerId)}catch(_){}
      if(navigator.vibrate)navigator.vibrate(20);
    };
    const move=ev=>{
      if(!active){
        const far=Math.hypot(ev.clientX-sx,ev.clientY-sy);
        if(isMouse&&far>5)start();
        else if(!isMouse&&far>8){cleanup()} // User wants to scroll: cancel drag
        if(!active)return;
      }
      ev.preventDefault();
      // Auto-scroll the tab bar near the edges
      const tr=tabsEl.getBoundingClientRect();
      if(ev.clientX<tr.left+30)tabsEl.scrollLeft-=8;
      else if(ev.clientX>tr.right-30)tabsEl.scrollLeft+=8;
      // Swap places when hovering over a neighboring tab
      const over=[...tabsEl.children].find(t=>{
        if(t===btn)return false;
        const r=t.getBoundingClientRect();
        return ev.clientX>r.left&&ev.clientX<r.right;
      });
      if(over){
        const after=btn.compareDocumentPosition(over)&Node.DOCUMENT_POSITION_FOLLOWING;
        tabsEl.insertBefore(btn,after?over.nextSibling:over);
      }
      btn.style.transform="none";
      const left=btn.getBoundingClientRect().left;
      btn.style.transform=`translateX(${ev.clientX-grab-left}px)`;
    };
    const cleanup=()=>{
      clearTimeout(timer);
      btn.removeEventListener("pointermove",move);
      btn.removeEventListener("pointerup",end);
      btn.removeEventListener("pointercancel",end);
      window.removeEventListener("pointermove",move);
      window.removeEventListener("pointerup",end);
      window.removeEventListener("pointercancel",end);
    };
    const end=()=>{
      cleanup();
      if(active){
        btn.classList.remove("dragging");btn.style.transform="";
        openTabs=[...tabsEl.children].map(b=>b.dataset.id);
        dragging=null;
        renderTabs();
        setTimeout(()=>{dragMoved=false},50); // Prevents an accidental click after dragging
      }
    };
    if(!isMouse)timer=setTimeout(start,350);
    window.addEventListener("pointermove",move,{passive:false});
    window.addEventListener("pointerup",end);
    window.addEventListener("pointercancel",end);
  });
}

function revealActiveTab(prevScroll){
  tabsEl.scrollLeft=prevScroll;
  const a=tabsEl.querySelector(".tab-btn.active");
  if(!a)return;
  const ar=a.getBoundingClientRect(),tr=tabsEl.getBoundingClientRect();
  if(ar.left<tr.left)tabsEl.scrollTo({left:tabsEl.scrollLeft+ar.left-tr.left-8,behavior:"smooth"});
  else if(ar.right>tr.right)tabsEl.scrollTo({left:tabsEl.scrollLeft+ar.right-tr.right+8,behavior:"smooth"});
}

function renderTabs(){
  const prevScroll=tabsEl.scrollLeft;
  const hasTabs=openTabs.length>0;
  document.getElementById("close-all-btn").style.display=hasTabs?"":"none";
  document.querySelector(".tabs-clear").style.display=hasTabs?"":"none";
  document.querySelector(".add-wrap").style.display=hasTabs?"":"none";
  tabsEl.innerHTML="";
  openTabs.forEach(id=>{
    const lang=getLang(id);
    const btn=document.createElement("button");
    btn.className="tab-btn"+(id===activeLang?" active":"");
    btn.innerHTML=`${badge(lang)} ${lang.name}<span class="tab-close" title="Close">${svg("xmark",11)}</span>`;
    btn.dataset.id=id;
    btn.addEventListener("click",()=>{if(!dragMoved)switchTab(id)});
    btn.addEventListener("contextmenu",e=>e.preventDefault());
    attachDrag(btn);
    btn.querySelector(".tab-close").addEventListener("click",e=>{e.stopPropagation();removeLanguage(id)});
    tabsEl.appendChild(btn);
  });
  revealActiveTab(prevScroll);
}

function renderMenu(){
  const prevMenuScroll=menuEl.scrollTop;
  menuEl.innerHTML="";
  LANGUAGES.forEach(lang=>{
    const added=openTabs.includes(lang.id);
    const m=lang.mode==="web"?"browser":lang.mode;
    const item=document.createElement("div");
    item.className="lang-item"+(added?" added":"");
    item.innerHTML=`${badge(lang)} ${lang.name}`+(added?`<span class="check">${svg("check",12)}</span>`:"")+`<span class="mode-mini mode-${m}">${modeLabel(m)}</span>`;
    item.addEventListener("click",()=>addLanguage(lang.id)); // menu stays open so several languages can be picked
    menuEl.appendChild(item);
  });
  menuEl.scrollTop=prevMenuScroll;
}

function saveCurrent(){if(activeLang)codes[activeLang]=codeArea.value}

// ================== Language picker (shown in the editor area while no tab is open) ==================
const pickerEl=document.getElementById("picker");
const picked=new Set();

function renderPicker(){
  const prevScroll=pickerEl.scrollTop;
  pickerEl.innerHTML="";
  const title=document.createElement("div");
  title.className="picker-title";
  title.textContent="Select Languages";
  const grid=document.createElement("div");
  grid.className="picker-grid";
  LANGUAGES.forEach(lang=>{
    const on=picked.has(lang.id);
    const item=document.createElement("div");
    item.className="picker-item"+(on?" selected":"");
    item.innerHTML=`${badge(lang)} ${lang.name}<span class="picker-check">${on?svg("check",12):""}</span>`;
    item.addEventListener("click",e=>{
      // Double click: open this language directly
      if(e.detail>=2){picked.clear();picked.add(lang.id);openPicked();return}
      if(picked.has(lang.id))picked.delete(lang.id);else picked.add(lang.id);
      renderPicker();
    });
    grid.appendChild(item);
  });
  const foot=document.createElement("div");
  foot.className="picker-foot";
  const btn=document.createElement("button");
  btn.className="btn run-btn";
  btn.type="button";
  btn.disabled=!picked.size;
  btn.style.cursor=picked.size?"pointer":"not-allowed";
  btn.textContent="Open Selected"+(picked.size?" ("+picked.size+")":"");
  btn.addEventListener("click",openPicked);
  foot.appendChild(btn);
  pickerEl.append(title,grid,foot);
  pickerEl.scrollTop=prevScroll;
}

// Enter on the keyboard opens the selected languages (same as "Open Selected")
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||e.isComposing)return;
  if(activeLang||!picked.size)return; // only while the language picker is showing and something is selected
  const t=e.target;
  if(t&&(t.tagName==="TEXTAREA"||t.tagName==="INPUT"||t.isContentEditable))return;
  e.preventDefault();
  openPicked();
});

function openPicked(){
  const ids=LANGUAGES.map(l=>l.id).filter(id=>picked.has(id));
  if(!ids.length)return;
  ids.forEach(id=>openTab(id));
  picked.clear();
  saveCurrent();activeLang=ids[0];
  renderTabs();renderMenu();loadEditor();
  scheduleRun(300);
}

// Preview panel: iframe for web languages, console otherwise
function updatePanel(){
  const web=isWeb(activeLang);
  output.style.display=web?"block":"none";
  consoleEl.style.display=web?"none":"block";
  titleEl.textContent="LIVE OUTPUT";
  modeTag.style.display="none";
}

// Hidden mirror of the textarea: measures how many visual rows each line takes once it wraps at the border
const mirror=document.createElement("div");
mirror.style.cssText="position:absolute;visibility:hidden;left:-9999px;top:0;padding:0;border:0;box-sizing:content-box;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;font-family:'Fira Code',monospace;font-size:14px;line-height:1.6";
document.body.appendChild(mirror);
function sizeMirror(){
  const cs=getComputedStyle(codeArea);
  mirror.style.width=Math.max(20,codeArea.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight))+"px";
  return parseFloat(cs.lineHeight)||22.4;
}
function updateLineNumbers(){
  const lh=sizeMirror(),lines=codeArea.value.split("\n");
  mirror.textContent="";
  const frag=document.createDocumentFragment();
  lines.forEach(l=>{const d=document.createElement("div");d.textContent=l===""?"\u00a0":l;frag.appendChild(d)});
  mirror.appendChild(frag);
  // one block per logical line: exactly one number, as tall as the rows the line takes after wrapping
  const nums=document.createDocumentFragment();
  for(let i=0;i<lines.length;i++){
    const rows=Math.max(1,Math.round(mirror.children[i].offsetHeight/lh));
    const d=document.createElement("div");
    d.textContent=i+1;d.style.height=(rows*lh)+"px";
    nums.appendChild(d);
  }
  lineNumbers.textContent="";
  lineNumbers.appendChild(nums);
  lineNumbers.scrollTop=codeArea.scrollTop;
}
if(window.ResizeObserver)new ResizeObserver(()=>updateLineNumbers()).observe(codeArea);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>updateLineNumbers());

function loadEditor(){
  pickerEl.style.display=activeLang?"none":"flex";
  if(!activeLang)renderPicker();
  codeArea.disabled=!activeLang;
  codeArea.value=activeLang?(codes[activeLang]??""):"";
  updateLineNumbers();
  updatePanel();
}

function switchTab(id){
  saveCurrent();activeLang=id;
  renderTabs();renderMenu();loadEditor();
  runActive();
}

function openTab(id){
  if(openTabs.includes(id))return;
  openTabs.push(id);
  codes[id]=EXAMPLES[id]; // every new tab starts with an example
}

function addLanguage(id){
  openTab(id);
  saveCurrent();activeLang=id;
  renderTabs();renderMenu();loadEditor();
  scheduleRun(300); // short delay so picking several languages in a row runs only once
}

function removeLanguage(id){
  saveCurrent();
  const i=openTabs.indexOf(id);
  delete runCache[id];
  openTabs.splice(i,1);
  delete codes[id];
  if(activeLang===id)activeLang=openTabs[Math.min(i,openTabs.length-1)]||null;
  renderTabs();renderMenu();loadEditor();
  runActive();
}

function closeAllTabs(){
  if(!openTabs.length)return;
  runId++;
  openTabs=[];codes={};activeLang=null;for(const k in runCache)delete runCache[k];
  renderTabs();renderMenu();loadEditor();
  output.srcdoc=blankDoc();consoleEl.textContent="";
}

// ================== Web preview (HTML + CSS + JS together) ==================
// JavaScript console.log / errors are shown inside the preview itself.
const CONSOLE_HOOK=`<script>
(function(){
  var ER=window.__dark?'#ff6b81':'#d00',WN=window.__dark?'#e6b450':'#b80';
  function box(){var b=document.getElementById('__c');if(!b){b=document.createElement('div');b.id='__c';document.body.appendChild(b)}return b}
  function w(t,c){var b=box();b.style.cssText='font:13px/1.6 monospace;white-space:pre-wrap;border-top:1px dashed #999;margin-top:12px;padding-top:8px;color:'+(window.__dark?'#dfe3f2':'#222');var d=document.createElement('div');if(c)d.style.color=c;d.textContent=t;b.appendChild(d)}
  function f(a){return a.map(function(x){if(x instanceof Error)return x.stack||x.message;if(typeof x==='object'&&x!==null){try{return JSON.stringify(x)}catch(e){return String(x)}}return String(x)}).join(' ')}
  ['log','info','warn','error'].forEach(function(k){
    var o=console[k];
    console[k]=function(){var a=[].slice.call(arguments);w(f(a),k==='error'?ER:k==='warn'?WN:'');o.apply(console,a)};
  });
  window.addEventListener('error',function(e){w('Error: '+e.message,ER)});
  window.addEventListener('unhandledrejection',function(e){w('Error: '+(e.reason&&e.reason.message||e.reason),ER)});
})();
<\/script>`;

// Preview area follows the theme: dark by default in dark mode (page code can still set its own colors)
const previewCss=()=>theme==="dark"?":root{color-scheme:dark}body{background:#1a1c23;color:#dfe3f2}":"";
const themeTag=()=>`<style id="__dm">${previewCss()}</style>`;
function blankDoc(){return `<!DOCTYPE html><html><head><meta charset="UTF-8">${themeTag()}</head><body></body></html>`}
function syncPreviewTheme(){ // switching theme: recolor the open preview without re-running the code
  try{const st=output.contentDocument&&output.contentDocument.getElementById("__dm");if(st)st.textContent=previewCss()}catch(e){}
}
function runWeb(data){
  saveCurrent();
  const html=openTabs.includes("html")?(codes.html??""):"";
  const css=openTabs.includes("css")?(codes.css??""):"";
  const js=openTabs.includes("javascript")?(codes.javascript??""):"";
  // With "Run All", results from other languages are available in JS as INPUT (last output) and OUTPUTS (by language id)
  const safe=v=>JSON.stringify(v).replace(/</g,"\\u003c");
  const inj=data?`<script>window.INPUT=${safe(data.INPUT)};window.OUTPUTS=${safe(data.OUTPUTS)};<\/script>`:"";
  const dk=theme==="dark"?"<script>window.__dark=true<\/script>":"";
  output.srcdoc=`<!DOCTYPE html><html><head><meta charset="UTF-8">${themeTag()}<style>${css}</style></head><body>${html}<div id="__c"></div>${inj}${dk}${CONSOLE_HOOK}<script>${js}<\/script></body></html>`;
}

// ================== Run in browser (no server) ==================
const scriptCache={};
function loadScript(src){
  return scriptCache[src]||(scriptCache[src]=new Promise((res,rej)=>{
    const s=document.createElement("script");s.src=src;s.onload=res;
    s.onerror=()=>{delete scriptCache[src];rej(new Error("Failed to load library: "+src))};
    document.head.appendChild(s);
  }));
}
const fmt=a=>a.map(x=>{
  if(x instanceof Error)return x.message;
  if(typeof x==="object"&&x!==null){try{return JSON.stringify(x)}catch(e){return String(x)}}
  return String(x);
}).join(" ");

async function capture(fn){
  const out=[],orig={};
  ["log","info","warn","error"].forEach(k=>{orig[k]=console[k];console[k]=(...a)=>out.push(fmt(a))});
  try{await fn()}finally{Object.keys(orig).forEach(k=>console[k]=orig[k])}
  return out.join("\n");
}

async function runPython(code,input=""){
  await loadScript("https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js");
  window.__py=window.__py||await loadPyodide();
  const out=[],all=[];
  if(input){
    const lines=input.replace(/\n$/,"").split("\n");
    window.__py.setStdin({stdin:()=>lines.length?lines.shift():undefined});
  }else window.__py.setStdin();
  window.__py.setStdout({batched:s=>{out.push(s);all.push(s)}});
  window.__py.setStderr({batched:s=>all.push(s)});
  await window.__py.runPythonAsync(code);
  return {text:all.join("\n"),stdout:out.join("\n")};
}

async function runTS(code,input=""){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/typescript/5.4.5/typescript.min.js");
  const js=ts.transpileModule(code,{compilerOptions:{target:"ES2020"}}).outputText;
  const AsyncFn=Object.getPrototypeOf(async function(){}).constructor;
  return capture(()=>new AsyncFn("input",js)(input));
}

async function runSQL(code){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js");
  const SQL=await initSqlJs({locateFile:f=>"https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/"+f});
  const db=new SQL.Database();
  const res=db.exec(code);
  if(!res.length)return "(Done — no results to display)";
  return res.map(t=>[t.columns.join(" | "),"-".repeat(t.columns.join(" | ").length),...t.values.map(r=>r.join(" | "))].join("\n")).join("\n\n");
}

async function runLua(code,input=""){
  await loadScript("https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js");
  // Piped input is available as the global string INPUT (bytes encoded as decimal escapes, kept on the same line so error line numbers don't shift)
  const bytes=new TextEncoder().encode(input||"");
  const lit='"'+[...bytes].map(b=>"\\"+String(b).padStart(3,"0")).join("")+'"';
  return capture(()=>fengari.load("INPUT="+lit+";"+code)());
}

// ================== Run on server (Judge0) ==================
// JVM languages (Scala/Java/Kotlin) get more memory/time, retry if limits are rejected,
// fall back to name lookup if the language isn't matched, poll if "wait" isn't supported,
// and show full compile errors.
const langCache={};
const enc=s=>btoa(unescape(encodeURIComponent(s)));
const dec=s=>s?decodeURIComponent(escape(atob(s))):"";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function judgeSubmit(host,body){
  const q="?base64_encoded=true&fields=*";
  let r=await fetch(host+"/submissions"+q+"&wait=true",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  let d=await r.json().catch(()=>({}));
  if(r.ok&&d.status&&d.status.id>2)return {ok:true,data:d};
  if(r.ok&&d.token||(!r.ok&&/wait/i.test(JSON.stringify(d)))){
    if(!d.token){
      r=await fetch(host+"/submissions"+q,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      d=await r.json().catch(()=>({}));
      if(!r.ok)return {ok:false,data:d};
    }
    for(let i=0;i<40;i++){
      await sleep(1200);
      const p=await (await fetch(host+"/submissions/"+d.token+q)).json();
      if(p.status&&p.status.id>2)return {ok:true,data:p};
    }
    return {ok:false,data:{error:"Timeout"}};
  }
  return {ok:r.ok,data:d};
}

async function runServer(lang,code,input=""){
  let lastErr="Could not connect to any server";
  for(const host of JUDGE_HOSTS){
    try{
      if(!langCache[host])langCache[host]=await (await fetch(host+"/languages")).json();
      let list=langCache[host].filter(l=>JUDGE_MATCH[lang.id].test(l.name));
      if(!list.length)list=langCache[host].filter(l=>new RegExp(lang.name.replace(/[+#]/g,"\\$&"),"i").test(l.name));
      const found=list.sort((a,b)=>b.id-a.id)[0];
      if(!found){lastErr=lang.name+" is not available on this server ("+host+")";continue}

      const jvm=["scala","java","kotlin"].includes(lang.id);
      const sin=input?{stdin:enc(input)}:{};
      const base={source_code:enc(code),language_id:found.id,cpu_time_limit:jvm?15:10,wall_time_limit:jvm?20:15,...sin};
      let res=await judgeSubmit(host,jvm?{...base,memory_limit:512000}:base);
      if(!res.ok&&jvm){ // If the server rejects custom limits, retry with default limits
        res=await judgeSubmit(host,{source_code:enc(code),language_id:found.id,...sin});
      }
      if(!res.ok){lastErr=JSON.stringify(res.data);continue}

      const d=res.data;
      const st=d.status&&d.status.id>3?"["+d.status.description+"]":"";
      // Hide internal "WARNING:" lines from JVM languages (Kotlin/Java/Scala); real errors are kept
      // Also hide Dart compiler's "Info: Compiling..." / "Generated: ..." lines
      const NOISE=/^(WARNING:|Info: Compiling with sound null safety|Generated: \/box\/)/;
      const clean=t=>t.split("\n").filter(l=>!NOISE.test(l)).join("\n").trim();
      const text=[dec(d.stdout),clean(dec(d.stderr)),clean(dec(d.compile_output)),dec(d.message),st].filter(Boolean).join("\n");
      return {text:text||"(No output)",stdout:dec(d.stdout),error:d.status&&d.status.id>3};
    }catch(e){lastErr=e.message}
  }
  throw new Error(lastErr);
}

// ================== Run / Reset / Download ==================
// Runs one non-web language and returns {text, stdout, error}
async function runOne(lang,code,input=""){
  if(lang.mode==="server"){
    const r=await runServer(lang,code,input);
    return {text:r.text,stdout:r.stdout,error:r.error};
  }
  let r;
  if(lang.id==="python")r=await runPython(code,input);
  else if(lang.id==="typescript")r=await runTS(code,input);
  else if(lang.id==="sql")r=await runSQL(code);
  else r=await runLua(code,input);
  if(typeof r==="string")r={text:r,stdout:r};
  return {text:r.text,stdout:r.stdout,error:false};
}

// ================== Run the active tab (automatic) ==================
// Only the tab you are viewing runs. HTML, CSS and JavaScript are the exception: they are
// combined into one live preview, because a web page needs all three together.
// Results are cached per tab, so switching back to an unchanged tab is instant.
async function runActive(){
  saveCurrent();
  const my=++runId;
  updatePanel();
  if(!activeLang){output.srcdoc=blankDoc();consoleEl.textContent="";return}
  const id=activeLang,lang=getLang(id);
  if(lang.mode==="web"){runWeb();return}
  const code=codes[id]||"";
  if(!code.trim()){consoleEl.className="";consoleEl.textContent="";return}
  const show=r=>{consoleEl.className=r.error?"err":"";consoleEl.textContent=r.text||"(No output)"};
  if(runCache[id]&&runCache[id].key===code){show(runCache[id].r);return}
  consoleEl.className="info";
  consoleEl.textContent=lang.mode==="server"?"Running on server... (JVM languages may take 10–20 seconds)":"Running... (the first run may take a moment to load libraries)";
  try{
    const r=await runOne(lang,code);
    if(my!==runId)return; // A newer run started
    runCache[id]={key:code,r};
    show(r);
  }catch(e){
    if(my!==runId)return;
    show({text:"Error: "+(e&&e.message||e),error:true});
  }
}

function resetCode(){
  if(!activeLang)return;
  codeArea.value="";
  codes[activeLang]="";
  updateLineNumbers();
  scheduleRun(300);
}

function downloadCode(){
  if(!activeLang)return;
  const lang=getLang(activeLang);
  const blob=new Blob([codeArea.value],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=lang.file||("main."+lang.ext);
  a.click();
  URL.revokeObjectURL(a.href);
}

// ================== Events ==================
let timer;
function scheduleRun(ms){clearTimeout(timer);timer=setTimeout(runActive,ms)}
codeArea.addEventListener("input",()=>{
  updateLineNumbers();saveCurrent();
  clearTimeout(timer);
  if(!activeLang)return;
  const mode=getLang(activeLang).mode;
  scheduleRun(mode==="web"?350:mode==="browser"?600:1500);
});
codeArea.addEventListener("scroll",()=>{lineNumbers.scrollTop=codeArea.scrollTop});
codeArea.addEventListener("keydown",e=>{
  if(e.key==="Tab"){
    e.preventDefault();
    const multi=codeArea.value.slice(codeArea.selectionStart,codeArea.selectionEnd).includes("\n");
    if(e.shiftKey||multi){indentLines(e.shiftKey?-1:1);return}
    const s=codeArea.selectionStart;
    codeArea.setRangeText("    ",s,codeArea.selectionEnd,"end");
    codeArea.dispatchEvent(new Event("input"));
  }else if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();runActive()}
  else if((e.ctrlKey||e.metaKey)&&e.key==="/"){e.preventDefault();toggleComment()}
});
// ================== Auto-close brackets/quotes — rules per language ==================
// pairs: which opening chars auto-close | triple: """ / ''' | block: /* */ | prefix: string prefixes (f"", r"", L"" ...)
// lt: how "<" is handled ("always" = HTML tags, "generic" = List< Map< vector< template< , plus #include <)
const Q="\"'";
const LANG_SYMBOLS={
  python:{pairs:"()[]{}"+Q,triple:1,prefix:/(?:^|[^\w])(?:[rRbBuUfF]{1,2})$/},
  html:{pairs:"()[]{}"+Q+"`<",lt:"always",htmlComment:1},
  css:{pairs:"()[]{}"+Q,block:1},
  javascript:{pairs:"()[]{}"+Q+"`",block:1},
  typescript:{pairs:"()[]{}"+Q+"`<",lt:"generic",block:1},
  sql:{pairs:"()[]"+Q+"`",block:1},
  lua:{pairs:"()[]{}"+Q},
  java:{pairs:"()[]{}"+Q+"<",lt:"generic",triple:1,block:1},
  c:{pairs:"()[]{}"+Q+"<",lt:"include",block:1,prefix:/(?:^|[^\w])(?:L|u|U|u8)$/},
  cpp:{pairs:"()[]{}"+Q+"<",lt:"generic",block:1,prefix:/(?:^|[^\w])(?:L|u|U|u8|R|LR|uR|UR|u8R)$/},
  csharp:{pairs:"()[]{}"+Q+"<",lt:"generic",triple:1,block:1},
  php:{pairs:"()[]{}"+Q+"`",block:1},
  go:{pairs:"()[]{}"+Q+"`",block:1},
  rust:{pairs:"()[]{}"+Q+"<|",pipe:/(?:[(,=]|\bmove)\s*$/,lt:"generic",turbofish:1,lifetime:1,block:1,prefix:/(?:^|[^\w])(?:b|r|br|rb|c|cr)$/},
  kotlin:{pairs:"()[]{}"+Q+"<",lt:"generic",triple:1,block:1},
  swift:{pairs:"()[]{}"+Q+"<",lt:"generic",triple:1,block:1},
  ruby:{pairs:"()[]{}"+Q+"`|",pipe:/(?:\{|\bdo)\s*$/},
  dart:{pairs:"()[]{}"+Q+"<",lt:"generic",triple:1,block:1,prefix:/(?:^|[^\w])r$/},
  r:{pairs:"()[]{}"+Q+"`",prefix:/(?:^|[^\w])[rR]$/},
  scala:{pairs:"()[]{}"+Q,triple:1,block:1,prefix:/(?:^|[^\w])(?:s|f|raw)$/}

const VOID_TAGS=new Set("area base br col embed hr img input link meta param source track wbr".split(" "));
const CLOSE_OF={"(":")","[":"]","{":"}","<":">",'"':'"',"'":"'","`":"`","|":"|"};
const GENERIC_KW=/^(?:impl|template|typename|function|vector|map|set|list|array|deque|queue|stack|pair|tuple|optional|variant|span|bitset|multimap|multiset|unordered_map|unordered_set|priority_queue|unique_ptr|shared_ptr|weak_ptr|atomic|static_cast|dynamic_cast|reinterpret_cast|const_cast|make_pair|make_shared|make_unique)$/;

  const w=(before.match(/[A-Za-z_]\w*$/)||[""])[0];
  if(!w)return !!cfg.turbofish&&before.endsWith("::");
  if(/^[A-Z]/.test(w)||GENERIC_KW.test(w))return true;

  return /\b(?:fn|struct|enum|trait|type|class|interface|fun|func|def|function)\s+\w+$/.test(before);

// ================== Auto-add missing line endings (; : then/do/end) when Enter is pressed ==================
const SEMI_LANGS=new Set(["javascript","typescript","java","c","cpp","csharp","php","rust","dart"]);
const MODS="(?:(?:public|private|protected|internal|static|final|abstract|sealed|partial|export|default|async|unsafe|pub|override|virtual|readonly|extern|const)\\s+)*";

const RE_NOTDECL=/^(?:return|throw|new|await|yield|delete|else|case|goto|print|echo|typeof|const|let|var|use)\b/;
const RE_METHOD=/^[\w<>\[\],:*&.\s]+\s+[\w~]+\s*\([^;=]*\)\s*(?:const|override|noexcept|throws\s+[\w, .]+)?$/;
function endFix(id,line,prev){
  const t=line.trim();
  if(!t)return "";
  const strip=t.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`[^`]*`/g,'""');
  const cnt=re=>(strip.match(re)||[]).length;
  if(cnt(/\(/g)!==cnt(/\)/g)||cnt(/\[/g)!==cnt(/\]/g)||cnt(/\{/g)!==cnt(/\}/g))return "";
  if(id==="python"){ // if/for/def/class... -> add ":"
    if(/#/.test(strip)||/[:,\\]$/.test(strip))return "";
    if(/^(?:else|try|finally)$/.test(t))return ":";
    if(!/^(?:if|elif|for|while|with|def|class|except|async\s+(?:def|for|with)|match|case)\b/.test(t))return "";

    if(/--/.test(strip))return "";
    if(/^(?:if|elseif)\s+\S/.test(t)&&!/\bthen\b/.test(t))return " then";
    if(/^(?:for|while)\s+\S/.test(t)&&!/\bdo\b/.test(t))return " do";
    return "";
  }

    if(/--/.test(strip)||/[;,(]$/.test(strip))return "";
    if(/^(?:insert\s+into|create\s+table)\b/i.test(t)&&/\)$/.test(strip))return ";";
    if(/^drop\s+\w+\s+(?:if\s+exists\s+)?\w+$/i.test(t))return ";";
    return "";
  }

  if(/^(?:#|@|\*|\.|\?|:|\}|\]|<\?|\?>)/.test(t))return "";
  if(/(?:\+\+|--)$/.test(strip))return ";";
  if(/[;{(,\[:.+\-*\/%=<>&|^!?\\]$/.test(strip))return "";
  if(RE_BLOCKDECL.test(t)||RE_CONTROL.test(t)||RE_LONE_KW.test(t))return "";
  if(/^[A-Za-z_$][\w$]*$/.test(t)&&!RE_BARE_OK.test(t))return "";
  if(/^(?:["'`]|\d)/.test(t))return "";
  if(/^[\w$'"-]+\s*:(?!:)\s*\S/.test(t))return "";
  if(/\bfunction\b\s*[\w$]*\s*\([^)]*\)$/.test(strip))return "";
  if(!RE_NOTDECL.test(t)&&RE_METHOD.test(strip)&&/\)$/.test(strip))return "";
  if(id==="rust"&&!(/^(?:let|use|const|static|return|break|continue|type|mod)\b/.test(t)||/!\s*[(\[{]/.test(strip)||/(?:^|[^=!<>])=(?!=)/.test(strip)))return "";
  return ";";
}
// Ruby / Lua: after "def", "if", "function"... add the closing "end" automatically
function needsEnd(id,line,after){
  const t=line.trim(),rows=after.split("\n");
  if(!t||rows[0].trim())return false;
  const nl=rows.slice(1).find(l=>l.trim())||"",ind=l=>l.match(/^\s*/)[0].length;
  if(/^end\b/.test(nl.trim())||ind(nl)>ind(line))return false; // already closed, or a body already exists
  if(/\bend$/.test(t))return false;
  if(id==="ruby")return !/#/.test(t)&&(/^(?:def|class|module|if|unless|while|until|for|case|begin)\b/.test(t)||/\bdo(?:\s*\|[^|]*\|)?$/.test(t));
  if(/--/.test(t))return false;
  return /^(?:local\s+)?function\b/.test(t)||/\bfunction\s*[\w.:]*\s*\([^)]*\)$/.test(t)||/^(?:if\b.*\bthen|(?:for|while)\b.*\bdo|do)$/.test(t);
}
// Enter on a bare "print" / "console.log" / "println!" ...: add "()" and put the caret inside
const BARE_CALLS={
  python:"print input",javascript:"console.log console.error console.warn alert",typescript:"console.log console.error console.warn alert",
  java:"System.out.println System.out.print",c:"printf",csharp:"Console.WriteLine Console.Write",go:"fmt.Println fmt.Print fmt.Printf",
  rust:"println! print! eprintln!",kotlin:"println print",swift:"print",dart:"print",r:"print cat",scala:"println print",lua:"print",php:"var_dump print_r"
};
function applyBareCall(){
  const ta=codeArea,s=ta.selectionStart,v=ta.value,set=activeLang&&BARE_CALLS[activeLang];
  if(!set||s!==ta.selectionEnd)return false;
  const ls=v.lastIndexOf("\n",s-1)+1,i=v.indexOf("\n",s),le=i<0?v.length:i;
  if(v.slice(s,le).trim())return false;
  const t=v.slice(ls,s).trim();
  if(!set.split(" ").includes(t))return false;
  const p=ls+v.slice(ls,s).replace(/\s+$/,"").length;
  ta.setRangeText("()",p,s,"end");ta.setSelectionRange(p+1,p+1);
  return true;
}
// Called right before Enter is handled: appends the missing ending to the current line
function applyAutoEnd(){
  const ta=codeArea,s=ta.selectionStart,v=ta.value;
  if(!activeLang||s!==ta.selectionEnd)return;
  const ls=v.lastIndexOf("\n",s-1)+1,i=v.indexOf("\n",s),le=i<0?v.length:i;
  if(v.slice(s,le).trim())return; // there is text after the caret
  const line=v.slice(ls,s),fx=endFix(activeLang,line,v.slice(0,ls));
  if(fx){const p=ls+line.replace(/\s+$/,"").length;ta.setRangeText(fx,p,p,"preserve")}

codeArea.addEventListener("beforeinput",e=>{
  if(e.isComposing||!activeLang)return;
  const cfg=LANG_SYMBOLS[activeLang];if(!cfg)return;
  const ta=codeArea,s=ta.selectionStart,en=ta.selectionEnd,v=ta.value;
  const fire=()=>ta.dispatchEvent(new Event("input"));
  const isWord=c=>/\w/.test(c);
  const has=c=>cfg.pairs.includes(c);
  const before=v.slice(0,s);

  if(e.inputType==="insertText"&&e.data&&e.data.length===1){
    const ch=e.data,prev=v[s-1]||"",next=v[en]||"";

    // 0) HTML: typing ">" of an opening tag inserts the closing tag </div>
    if(s===en&&ch===">"&&cfg.htmlComment){
      const lt=v.lastIndexOf("<",s-1);
      if(lt>=0&&v.lastIndexOf(">",s-1)<lt){
        const m=v.slice(lt,s).match(/^<([A-Za-z][\w:.-]*)(\s[^<>]*)?$/);
        if(m&&!v.slice(lt,s).endsWith("/")&&!VOID_TAGS.has(m[1].toLowerCase())){
          const tag=m[1].replace(/[.*+?^${}()|[\]\\-]/g,"\\$&");
          const full=v.slice(0,s)+">"+v.slice(next===">"?en+1:en);
          const opens=(full.match(new RegExp("<"+tag+"(?=[\\s>/])","gi"))||[]).length;
          const closes=(full.match(new RegExp("</"+tag+"\\s*>","gi"))||[]).length;
          if(opens>closes){
            e.preventDefault();
            ta.setRangeText(">"+"</"+m[1]+">",s,next===">"?en+1:en,"end");
            ta.setSelectionRange(s+1,s+1);fire();return;
          }
        }
      }
    }
    // 1) typing a closing char right before the same char: just move over it
    if(s===en&&next===ch&&[...cfg.pairs].some(o=>CLOSE_OF[o]===ch)){
      e.preventDefault();ta.setSelectionRange(s+1,s+1);return;
    }
    // 2) a "<" that was auto-paired turned out to be an operator (x<5, a<=b, 1<<2): drop the extra ">"
    if(s===en&&has("<")&&cfg.lt!=="always"&&prev==="<"&&next===">"&&/[\s=<\d+\-!]/.test(ch)){

    }

      ta.setSelectionRange(s+1,en+1);fire();return;
    }
    // 5) triple quotes (""" / ''')
    if(cfg.triple&&(ch==='"'||ch==="'")&&v.slice(s-2,s)===ch+ch&&v[s-3]!==ch&&!isWord(next)){
      e.preventDefault();ta.setRangeText(ch+ch+ch+ch,s,en,"end");ta.setSelectionRange(s+1,s+1);fire();return;
    }
    // 6) context rules
    if(close===ch){ // quotes / backtick / pipe
      if(ch==="|"){if(!cfg.pipe.test(before)||isWord(next))return}
      else{
        const prefixed=cfg.prefix&&(ch==='"'||ch==="'")&&cfg.prefix.test(before);
        if(isWord(prev)&&!prefixed)return;            // don't -> no auto-quote

    ta.setSelectionRange(s+1,s+1);fire();

  }else if(e.inputType==="insertLineBreak"&&applyBareCall()){
    e.preventDefault();fire();keepCaretVisible();
  }else if(e.inputType==="insertLineBreak"&&(applyAutoEnd(),true)){
    const s=ta.selectionStart,en=ta.selectionEnd,v=ta.value,before=v.slice(0,s); // re-read: a ; or : may have been added
    // Enter: keep indentation; extra indent after { ( [ (and Python ":"); between a pair -> expand to 3 lines
    const IND="    ",ls=v.lastIndexOf("\n",s-1)+1,line=v.slice(ls,s);
    const indent=line.match(/^[ \t]*/)[0],prevCh=v[s-1]||"",nextCh=v[en]||"";
    const between=("{([".includes(prevCh)&&has(prevCh)&&CLOSE_OF[prevCh]===nextCh)||
      (cfg.htmlComment&&prevCh===">"&&v.slice(en,en+2)==="</"&&/<[A-Za-z][^<>]*>$/.test(before));
    const blk=(activeLang==="ruby"||activeLang==="lua")&&needsEnd(activeLang,line,v.slice(en));
    let text,caret;
    if(between){text="\n"+indent+IND+"\n"+indent;caret=s+1+indent.length+IND.length}
    else if(blk){text="\n"+indent+IND+"\n"+indent+"end";caret=s+1+indent.length+IND.length}
    else{
      const more=("{([".includes(prevCh)&&has(prevCh))||(activeLang==="python"&&/:\s*$/.test(line)&&!/^\s*#/.test(line)&&(nextCh===""||nextCh==="\n"));

  }
});
// Scroll so the caret stays visible after programmatic edits (line-height 1.6 x 14px, padding 15px, no wrapping)
function keepCaretVisible(){
  const ta=codeArea,lh=sizeMirror();
  mirror.textContent=ta.value.slice(0,ta.selectionStart)+"\u200b";
  const line=Math.max(1,Math.round(mirror.offsetHeight/lh)); // visual row of the caret (wrapped rows counted)
  const bottom=15+line*lh,top=15+(line-1)*lh;
  if(bottom>ta.scrollTop+ta.clientHeight)ta.scrollTop=bottom-ta.clientHeight+lh;
  else if(top<ta.scrollTop)ta.scrollTop=Math.max(0,top-lh);
  lineNumbers.scrollTop=ta.scrollTop;
}
function selectedLineRange(){
  const ta=codeArea,v=ta.value,s=ta.selectionStart,en=ta.selectionEnd;
  const ls=v.lastIndexOf("\n",s-1)+1,e2=(en>s&&v[en-1]==="\n")?en-1:en,i=v.indexOf("\n",e2);
  return {ls,le:i<0?v.length:i};
}
// Tab / Shift+Tab on several lines: indent / outdent them
function indentLines(dir){
  const ta=codeArea,{ls,le}=selectedLineRange(),s=ta.selectionStart,en=ta.selectionEnd;
  const old=ta.value.slice(ls,le),lines=old.split("\n");
  const out=lines.map(l=>dir>0?(l.trim()?"    "+l:l):l.replace(/^(?: {1,4}|\t)/,""));
  const text=out.join("\n");
  ta.setRangeText(text,ls,le,"preserve");
  if(s===en){const d=out[0].length-lines[0].length;const c=Math.max(ls,s+d);ta.setSelectionRange(c,c)}
  else ta.setSelectionRange(ls,ls+text.length);
  ta.dispatchEvent(new Event("input"));
}
// Ctrl+/ : comment / uncomment the selected lines (comment style depends on the language)
function toggleComment(){
  if(!activeLang)return;
  const ta=codeArea,{ls,le}=selectedLineRange(),s=ta.selectionStart,en=ta.selectionEnd;
  const tok={python:"#",ruby:"#",r:"#",sql:"--",lua:"--",html:["<!--","-->"],css:["/*","*/"]}[activeLang]||"//";
  const esc=x=>x.replace(/[.*+?^${}()|[\]\\\/-]/g,"\\$&");
  const lines=ta.value.slice(ls,le).split("\n"),body=lines.filter(l=>l.trim());
  if(!body.length)return;
  const isArr=Array.isArray(tok),o=isArr?tok[0]:tok,c=isArr?tok[1]:"";
  const reC=new RegExp("^(\\s*)"+esc(o)+" ?(.*?)"+(isArr?" ?"+esc(c)+"\\s*":"")+"$");
  const all=body.every(l=>reC.test(l));
  let out;
  if(all)out=lines.map(l=>reC.test(l)?l.replace(reC,"$1$2"):l);
  else{
    const min=Math.min(...body.map(l=>l.match(/^\s*/)[0].length));
    out=lines.map(l=>l.trim()?l.slice(0,min)+o+" "+l.slice(min)+(isArr?" "+c:""):l);
  }
  const text=out.join("\n"),oldLen=le-ls;
  ta.setRangeText(text,ls,le,"preserve");
  if(s===en){const cpos=Math.max(ls,s+text.length-oldLen);ta.setSelectionRange(cpos,cpos)}
  else ta.setSelectionRange(ls,ls+text.length);

// ================== Tooltips (mouse hover + touch long-press) ==================
const tipEl=document.createElement("div");
tipEl.id="tip";
document.body.appendChild(tipEl);
let tipTimer;
function showTip(el,autoHideMs){
  tipEl.textContent=el.dataset.tip;
  tipEl.classList.add("show");
  const r=el.getBoundingClientRect();
  const w=tipEl.offsetWidth;
  const x=Math.min(Math.max(r.left+r.width/2,w/2+8),window.innerWidth-w/2-8);
  tipEl.style.left=x+"px";
  tipEl.style.top=(r.bottom+8)+"px";
  clearTimeout(tipTimer);
  if(autoHideMs)tipTimer=setTimeout(hideTip,autoHideMs);
}
function hideTip(){clearTimeout(tipTimer);tipEl.classList.remove("show")}

document.querySelectorAll("[data-tip]").forEach(el=>{
  let pressTimer=null,longPressed=false;
  // Mouse: show on hover, hide on leave/click
  el.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse")showTip(el)});
  el.addEventListener("pointerleave",()=>{clearTimeout(pressTimer);hideTip()});
  // Touch: press and hold ~0.45s to show the label; a normal tap works as usual
  el.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse")return;
    longPressed=false;
    clearTimeout(pressTimer);
    pressTimer=setTimeout(()=>{longPressed=true;showTip(el,1800);if(navigator.vibrate)navigator.vibrate(15)},450);
  });
  ["pointerup","pointercancel"].forEach(t=>el.addEventListener(t,()=>clearTimeout(pressTimer)));
  el.addEventListener("contextmenu",e=>e.preventDefault());
  // If the label was shown by long-press, don't also trigger the button's action
  el.addEventListener("click",e=>{
    if(longPressed){e.preventDefault();e.stopImmediatePropagation();longPressed=false;return}
    hideTip();
  },true);
});

// Pure: list of suggestions for a prefix
function suggest(id,prefix,type,doc){
  const lp=prefix.toLowerCase(),out=new Map(),sql=id==="sql";
  const add=(w,kind)=>{
    if(!w)return;
    const text=(sql&&kind!=="var")?w.toUpperCase():w;
    if(!out.has(text)&&text.toLowerCase().startsWith(lp))out.set(text,{text,kind,o:out.size});
  };
  if(type==="tag")sp2(HTML_TAGS).forEach(w=>add(w,"tag"));
  else if(type==="attr")sp2(HTML_ATTRS).forEach(w=>add(w,"attr"));
  else if(type==="prop")sp2(CSS_PROPS).forEach(w=>add(w,"prop"));
  else if(type==="val"){sp2(CSS_VALS).forEach(w=>add(w,"val"));sp2(CSS_VFN).forEach(w=>add(w,"fn"))}
  else{
    const X=AC[id]||{};
    sp2(X.fn).forEach(w=>add(w,"fn"));
    const W=window.langWords?window.langWords(id):{kw:[],ct:[],ty:[],fn:[]};
    W.kw.concat(W.fn).forEach(w=>add(w,"kw"));sp2(X.kw).forEach(w=>add(w,"kw"));
    W.ty.concat(sp2(X.ty)).forEach(w=>add(w,"ty"));
    W.ct.concat(sp2(X.ct)).forEach(w=>add(w,"ct"));
    (doc.match(/[A-Za-z_$][\w$]{2,}/g)||[]).forEach(w=>add(w,"var"));
    // obj.method / Type::member: nothing matched as a whole word, so offer members of any object
    const cut=Math.max(prefix.lastIndexOf("."),prefix.lastIndexOf(":"));
    if(cut>0&&cut<prefix.length-1&&!out.size){
      const obj=prefix.slice(0,cut+1),mem=prefix.slice(cut+1).toLowerCase();
      sp2(X.mem).forEach(w=>{if(w.toLowerCase().startsWith(mem)&&!out.has(obj+w))out.set(obj+w,{text:obj+w,kind:"fn",o:out.size})});
      sp2(X.field).forEach(w=>{if(w.toLowerCase().startsWith(mem)&&!out.has(obj+w))out.set(obj+w,{text:obj+w,kind:"field",o:out.size})});
    }
  }
  const typedSep=/[.:]/.test(prefix),per={};
  return [...out.values()].filter(x=>x.text!==prefix||x.kind==="fn")
    .sort((a,b)=>RANK[a.kind]-RANK[b.kind]||(b.text.startsWith(prefix)-a.text.startsWith(prefix))||((typedSep||!(/[.:]/.test(a.text)&&/[.:]/.test(b.text)))?a.text.length-b.text.length:0)||a.o-b.o)
    .filter(x=>{ // before a "." is typed, show at most 2 entries per namespace (console.*, random.* ...)
      if(typedSep)return true;
      const i=x.text.search(/[.:]/);
      if(i<1)return true;
      const ns=x.text.slice(0,i);per[ns]=(per[ns]||0)+1;
      return per[ns]<=2;
    })
    .slice(0,8);
}
window.acSuggest=suggest;

// Where is the caret? Returns {prefix,type,lang} or null
function getCtx(){
  let id=activeLang;const s=ta.selectionStart;
  if(!id||s!==ta.selectionEnd)return null;
  let before=ta.value.slice(0,s);
  if(id==="html"){
    // caret inside <script> / <style>: suggest JavaScript / CSS
    const lo=before.toLowerCase();
    const so=lo.lastIndexOf("<script"),sc=lo.lastIndexOf("</script"),yo=lo.lastIndexOf("<style"),yc=lo.lastIndexOf("</style");
    const sg=so>-1?before.indexOf(">",so):-1,yg=yo>-1?before.indexOf(">",yo):-1;
    if(so>sc&&sg>-1){id="javascript";before=before.slice(sg+1)}
    else if(yo>yc&&yg>-1){id="css";before=before.slice(yg+1)}
    else{
      const lt=before.lastIndexOf("<");
      if(lt<0||lt<before.lastIndexOf(">"))return null;
      const tt=before.slice(lt);
      const sm=tt.match(/\sstyle\s*=\s*(["'])([^"']*)$/i); // inline style="..." -> CSS
      if(sm){
        const inn=sm[2],lc=inn.lastIndexOf(":"),ls=inn.lastIndexOf(";");
        if(lc>ls){const vm=inn.slice(lc+1).match(/(?:^|[\s(,])(-?[a-z][a-z-]{1,})$/i);return vm?{prefix:vm[1],type:"val",lang:"css"}:null}
        const pm=inn.match(/(?:^|[\s;])([a-z-]{2,})$/i);
        return pm?{prefix:pm[1],type:"prop",lang:"css"}:null;
      }
      if((tt.match(/"/g)||[]).length%2||(tt.match(/'/g)||[]).length%2)return null;
      const am=tt.match(/^<[A-Za-z][\w-]*\s(?:[^>]*\s)?([A-Za-z][\w:-]*)$/);
      if(am)return {prefix:am[1],type:"attr",lang:"html"};
      const tm=tt.match(/^<([A-Za-z][\w-]*)$/);
      return tm?{prefix:tm[1],type:"tag",lang:"html"}:null;
    }
  }
  const line=before.slice(before.lastIndexOf("\n")+1);
  const q=line.replace(/\\./g,"");
  if((q.match(/"/g)||[]).length%2||(q.match(/`/g)||[]).length%2||(id!=="rust"&&(q.match(/'/g)||[]).length%2))return null; // inside a string
  if(id==="css"){
    if(/\/\*(?![\s\S]*\*\/)/.test(before))return null; // inside a /* comment */
    const cl=before.replace(/\/\*[\s\S]*?\*\//g,"").replace(/"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'/g,"");
    const open=(cl.match(/\{/g)||[]).length-(cl.match(/\}/g)||[]).length;
    if(open<=0)return null;
    const lc=line.lastIndexOf(":"),ls=Math.max(line.lastIndexOf(";"),line.lastIndexOf("{"));
    if(lc>ls){ // after "property:" -> suggest values
      const vm=line.slice(lc+1).match(/(?:^|[\s(,])(-?[a-z][a-z-]{1,})$/i);
      return vm?{prefix:vm[1],type:"val",lang:id}:null;
    }
    const m=before.match(/(?:^|[\s;{])([a-z-]{2,})$/i);
    return m?{prefix:m[1],type:"prop",lang:id}:null;
  }
  const s2=line.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/g,"");
  const hash=["python","ruby","r","php"].includes(id),dash=id==="sql"||id==="lua";
  if((hash&&/#/.test(s2))||(dash&&/--/.test(s2))||(!hash&&!dash&&id!=="c"&&/\/\/|\/\*/.test(s2)))return null; // inside a comment
  const m=before.match(COLON.includes(id)?/[A-Za-z_$][\w$.:]*$/:/[A-Za-z_$][\w$.]*$/);
  return m&&m[0].length>=2?{prefix:m[0],type:"word",lang:id}:null;
}

// ---------- Popup ----------
const st=document.createElement("style");
st.textContent=`.ac{position:absolute;z-index:20;min-width:170px;max-width:min(320px,90%);background:var(--bg-header);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 25px var(--shadow);padding:4px;font-family:'Fira Code',monospace;font-size:13px}
.ac-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:5px 8px;border-radius:5px;cursor:pointer;color:var(--h-plain,var(--text));white-space:nowrap}
.ac-item.on{background:rgba(var(--accent-rgb),.2)}
.ac-item b{color:var(--accent);font-weight:600}
.ac-item i{font-style:normal;font-size:10px}
.k-fn{color:var(--h-fn)}.k-kw{color:var(--h-kw)}.k-ty{color:var(--h-ty)}.k-ct{color:var(--h-ct)}.k-var{color:var(--muted)}.k-prop{color:var(--h-prop)}.k-tag{color:var(--h-tag)}.k-attr{color:var(--h-attr)}.k-val{color:var(--h-str)}.k-field{color:var(--h-prop)}`;
document.head.appendChild(st);
const box=document.createElement("div");box.className="ac";box.style.display="none";host.appendChild(box);
const cm=document.createElement("div");
cm.style.cssText="position:absolute;visibility:hidden;left:-9999px;top:0;padding:15px;border:0;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;font-family:'Fira Code',monospace;font-size:14px;line-height:1.6";
document.body.appendChild(cm);
let items=[],sel=0,nav=false,pref="";

function hide(){box.style.display="none";items=[]}
function draw(){
  box.innerHTML="";
  items.forEach((it,i)=>{
    const d=document.createElement("div"),p=pref.length;
    d.className="ac-item"+(i===sel?" on":"");
    d.innerHTML="<span><b>"+esc2(it.text.slice(0,p))+"</b>"+esc2(it.text.slice(p))+(it.kind==="fn"?"()":"")+"</span><i class=\"k-"+it.kind+"\">"+KIND[it.kind]+"</i>";
    d.addEventListener("pointerdown",e=>{e.preventDefault();accept(it)}); // keeps the keyboard open on phones
    box.appendChild(d);
  });
}
function place(){
  const s=ta.selectionStart;
  cm.style.width=ta.clientWidth+"px";
  cm.textContent=ta.value.slice(0,s-pref.length);
  const sp=document.createElement("span");sp.textContent="\u200b";cm.appendChild(sp);
  const wr=wrap.getBoundingClientRect(),hr=host.getBoundingClientRect(),lh=22.4;
  box.style.display="block";
  const bw=box.offsetWidth,bh=box.offsetHeight;
  const y=wr.top-hr.top+sp.offsetTop-ta.scrollTop;
  let left=wr.left-hr.left+sp.offsetLeft-ta.scrollLeft,top=y+lh;
  left=Math.max(4,Math.min(left,hr.width-bw-4));
  if(top+bh>hr.height-4)top=y-bh-2; // not enough room below: show above the line
  box.style.left=left+"px";box.style.top=Math.max(4,top)+"px";
}
function show(ctx){
  const list=suggest(ctx.lang||activeLang,ctx.prefix,ctx.type,ta.value);
  if(!list.length){hide();return}
  items=list;sel=0;nav=false;pref=ctx.prefix;draw();place();
}
function accept(it){
  const s=ta.selectionStart,v=ta.value,nx=v[s]||"";
  let text=it.text,back=0;
  if(it.kind==="fn"&&nx!=="("&&activeLang!=="ruby"){text+="()";back=1}
  else if(it.kind==="prop"&&nx!==":")text+=": ";
  else if(it.kind==="attr"&&nx!=="="&&!BOOL_ATTRS.has(text)){text+='=""';back=1}
  ta.setRangeText(text,s-pref.length,s,"end");
  if(back){const c=ta.selectionStart-back;ta.setSelectionRange(c,c)}
  hide();ta.focus();
  ta.dispatchEvent(new Event("input")); // lets the editor update line numbers / run the code
}
ta.addEventListener("input",e=>{
  if(e.inputType!=="insertText"&&e.inputType!=="insertCompositionText"){hide();return}
  const c=getCtx();c?show(c):hide();
});
ta.addEventListener("keydown",e=>{
  if(box.style.display==="none")return;
  const k=e.key;
  if(k==="ArrowDown"||k==="ArrowUp"){e.preventDefault();sel=(sel+(k==="ArrowDown"?1:items.length-1))%items.length;nav=true;draw()}
  else if((k==="Tab"&&!e.shiftKey)||(k==="Enter"&&nav&&!e.ctrlKey&&!e.metaKey)){e.preventDefault();e.stopImmediatePropagation();accept(items[sel])}
  else if(k==="Escape"||k==="ArrowLeft"||k==="ArrowRight"||k==="Home"||k==="End"||k==="Enter")hide();
},true);
ta.addEventListener("scroll",hide);
ta.addEventListener("click",hide);
ta.addEventListener("blur",()=>setTimeout(hide,150));
const _le=loadEditor;
loadEditor=function(){hide();_le()};
})();
renderTabs();renderMenu();loadEditor();
if(!activeLang)output.srcdoc=blankDoc();
</script>
